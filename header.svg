<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Hi, I'm Ishy - Fullstack and Software Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29">
        <animate attributeName="stop-color" values="#0f0c29;#1b1464;#0f0c29" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#302b63">
        <animate attributeName="stop-color" values="#302b63;#6a11cb;#302b63" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#24243e">
        <animate attributeName="stop-color" values="#24243e;#0f2027;#24243e" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <rect width="1000" height="220" fill="url(#bg)"/>
  <path d="M0 160 Q125 120 250 160 T500 160 T750 160 T1000 160 T1250 160 T1500 160 T1750 160 T2000 160 V220 H0 Z" fill="#00f5d4" fill-opacity="0.18">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="9s" repeatCount="indefinite"/>
  </path>
  <path d="M0 175 Q125 145 250 175 T500 175 T750 175 T1000 175 T1250 175 T1500 175 T1750 175 T2000 175 V220 H0 Z" fill="#f72585" fill-opacity="0.22">
    <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="12s" repeatCount="indefinite"/>
  </path>
  <text x="500" y="95" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="54" font-weight="700" fill="#ffffff" opacity="0">Hi 👋 I'm Ishy
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
  </text>
  <text x="500" y="135" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#e0e0ff" opacity="0">Fullstack &amp; Software Developer
    <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="1.2s" fill="freeze"/>
  </text>
</svg>
